name: CPU regression tests

on:
  pull_request:
  push:
    branches: [main, codex/p17-baseline-capture]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==1.26.4 transformers==4.46.3 pytest==8.3.5
      - run: python -m pytest tests -q
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
